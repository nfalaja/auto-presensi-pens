name: PENS Auto Presensi 24/7 Cloud Engine

on:
  schedule:
    # Trigger otomatis setiap jam sebagai fail-safe
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: pens-cloud-engine
  cancel-in-progress: true

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unified Engine (50-Minute Shift)
        env:
          PENS_USERNAME: ${{ secrets.PENS_USERNAME }}
          PENS_PASSWORD: ${{ secrets.PENS_PASSWORD }}
          PENS_NETID: ${{ secrets.PENS_NETID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --duration 50

      - name: Auto-Relay to Next Shift (24/7 Estafet)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/presensi_daemon.yml/dispatches \
            -d '{"ref":"main"}' || true

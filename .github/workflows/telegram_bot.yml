name: Telegram Bot 24/7 Cloud Listener

on:
  schedule:
    # Trigger setiap jam untuk memastikan bot selalu ada yang aktif di cloud
    - cron: '0 * * * *'
  workflow_dispatch:

# Hindari duplikasi instance
concurrency:
  group: telegram-bot-cloud
  cancel-in-progress: true

jobs:
  bot-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Maksimal run 1 jam per runner, lalu diestafetkan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Cloud Telegram Bot Listener
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PENS_USERNAME: ${{ secrets.PENS_USERNAME }}
          PENS_PASSWORD: ${{ secrets.PENS_PASSWORD }}
          PENS_NETID: ${{ secrets.PENS_NETID }}
        run: |
          python bot_listener_cloud.py

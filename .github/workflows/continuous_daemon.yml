name: 24/7 Continuous Cloud Runner (No-Card, Self-Looping)

on:
  schedule:
    # Trigger cadangan tiap jam jika loop terputus
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: pens-247-cloud-daemon
  cancel-in-progress: true

jobs:
  run-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Maksimal limit GitHub 6 jam

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests selenium webdriver-manager

      - name: Run Cloud Daemon (Continuous 45-Minute Shift)
        env:
          PENS_USERNAME: ${{ secrets.PENS_USERNAME }}
          PENS_PASSWORD: ${{ secrets.PENS_PASSWORD }}
          PENS_NETID: ${{ secrets.PENS_NETID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Jalankan runner selama 50 menit
          python presensi_cloud.py

      - name: Trigger Next Relay Shift (Estafet Otomatis)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Memicu estafet runner berikutnya agar bot dan presensi tetap aktif 24/7..."
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/continuous_daemon.yml/dispatches \
            -d '{"ref":"main"}' || true

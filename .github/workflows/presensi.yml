name: PENS Auto Presensi Cloud (Gercep & Real-time)

on:
  schedule:
    # 08:00 - 17:00 WIB (UTC+7) setara dengan 01:00 - 10:00 UTC
    # Berjalan setiap 10 menit pada hari Senin s/d Jumat
    - cron: '*/10 1-10 * * 1-5'
  workflow_dispatch: # Mengizinkan tombol manual "Run workflow" di GitHub

# Pastikan tidak ada 2 runner yang bentrok di waktu bersamaan
concurrency:
  group: pens-presensi-group
  cancel-in-progress: false

jobs:
  check-presensi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager requests

      - name: Run Auto Presensi (Continuous Monitoring)
        env:
          PENS_USERNAME: ${{ secrets.PENS_USERNAME }}
          PENS_PASSWORD: ${{ secrets.PENS_PASSWORD }}
          PENS_NETID: ${{ secrets.PENS_NETID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python presensi_cloud.py
